version: '3.8'

services:
  # Aplicación Next.js
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: manteni-plus-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Variables de entorno para producción
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      # JWT Secret (CAMBIAR en producción)
      - JWT_SECRET=${JWT_SECRET:-manteni-plus-secret-key-change-in-production}
    networks:
      - manteni-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

